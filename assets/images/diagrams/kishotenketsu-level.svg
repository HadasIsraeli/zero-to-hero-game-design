<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 540' role='img' aria-labelledby='t d'><title id='t'>Kishōtenketsu: One Mechanic, Four Beats</title><desc id='d'>Introduce, develop, twist, conclude: Nintendo's level structure.</desc><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1F1B2E'/></marker></defs><rect width='960' height='540' fill='#FBF7F0'/><text x='48' y='64' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#1F1B2E'>Kishōtenketsu: One Mechanic, Four Beats</text><rect x='48' y='150' width='200' height='130' rx='18' fill='#E8553D'/><text x='148.0' y='207.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='24' font-weight='700' fill='#fff'>1 · Ki</text><text x='148.0' y='237.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='16' fill='#fff'>Introduce</text><text x='148' y='325' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' fill='#6B6478'>Safe space to try</text><text x='148' y='349' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' fill='#6B6478'>the new mechanic</text><line x1='248' y1='215' x2='268' y2='215' stroke='#1F1B2E' stroke-width='3' marker-end='url(#a)'/><rect x='270' y='150' width='200' height='130' rx='18' fill='#2E7DD7'/><text x='370.0' y='207.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='24' font-weight='700' fill='#fff'>2 · Shō</text><text x='370.0' y='237.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='16' fill='#fff'>Develop</text><text x='370' y='325' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' fill='#6B6478'>Add danger; use it</text><text x='370' y='349' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' fill='#6B6478'>for real</text><line x1='470' y1='215' x2='490' y2='215' stroke='#1F1B2E' stroke-width='3' marker-end='url(#a)'/><rect x='492' y='150' width='200' height='130' rx='18' fill='#2BA36B'/><text x='592.0' y='207.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='24' font-weight='700' fill='#fff'>3 · Ten</text><text x='592.0' y='237.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='16' fill='#fff'>Twist</text><text x='592' y='325' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' fill='#6B6478'>Combine or invert</text><text x='592' y='349' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' fill='#6B6478'>it — surprise</text><line x1='692' y1='215' x2='712' y2='215' stroke='#1F1B2E' stroke-width='3' marker-end='url(#a)'/><rect x='714' y='150' width='200' height='130' rx='18' fill='#F2A93B'/><text x='814.0' y='207.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='24' font-weight='700' fill='#fff'>4 · Ketsu</text><text x='814.0' y='237.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='16' fill='#fff'>Conclude</text><text x='814' y='325' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' fill='#6B6478'>Final test, then</text><text x='814' y='349' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' fill='#6B6478'>retire it</text><text x='480' y='470' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#6B6478'>Nintendo's 4-beat level structure (Koichi Hayashida, Super Mario 3D World)</text></svg>