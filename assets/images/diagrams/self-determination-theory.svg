<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 540' role='img' aria-labelledby='t d'><title id='t'>Why We Play: Self-Determination Theory</title><desc id='d'>Competence, autonomy and relatedness predict enjoyment and return play.</desc><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1F1B2E'/></marker></defs><rect width='960' height='540' fill='#FBF7F0'/><text x='48' y='64' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#1F1B2E'>Why We Play: Self-Determination Theory</text><rect x='370' y='110' width='220' height='100' rx='18' fill='#E8553D'/><text x='480.0' y='152.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='24' font-weight='700' fill='#fff'>Competence</text><text x='480.0' y='182.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='16' fill='#fff'>I'm getting better</text><rect x='110' y='360' width='220' height='100' rx='18' fill='#2E7DD7'/><text x='220.0' y='402.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='24' font-weight='700' fill='#fff'>Autonomy</text><text x='220.0' y='432.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='16' fill='#fff'>My choices matter</text><rect x='630' y='360' width='220' height='100' rx='18' fill='#2BA36B'/><text x='740.0' y='402.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='24' font-weight='700' fill='#fff'>Relatedness</text><text x='740.0' y='432.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='16' fill='#fff'>I'm connected</text><polygon points='480,215 335,360 625,360' fill='none' stroke='#6B6478' stroke-width='3' stroke-dasharray='8 6'/><text x='480' y='320' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='20' fill='#1F1B2E'>Intrinsic motivation</text><text x='480' y='505' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#6B6478'>Self-Determination Theory in games — Ryan, Rigby &amp; Przybylski (2006)</text></svg>