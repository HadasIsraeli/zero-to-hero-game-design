<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 540' role='img' aria-labelledby='t d'><title id='t'>The MDA Framework</title><desc id='d'>Mechanics produce Dynamics, which produce Aesthetics; players perceive the chain in reverse.</desc><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1F1B2E'/></marker></defs><rect width='960' height='540' fill='#FBF7F0'/><text x='48' y='64' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#1F1B2E'>The MDA Framework</text><rect x='60' y='200' width='240' height='120' rx='18' fill='#E8553D'/><text x='180.0' y='252.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='24' font-weight='700' fill='#fff'>Mechanics</text><text x='180.0' y='282.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='16' fill='#fff'>rules, verbs, code</text><rect x='360' y='200' width='240' height='120' rx='18' fill='#2E7DD7'/><text x='480.0' y='252.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='24' font-weight='700' fill='#fff'>Dynamics</text><text x='480.0' y='282.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='16' fill='#fff'>behaviour in play</text><rect x='660' y='200' width='240' height='120' rx='18' fill='#2BA36B'/><text x='780.0' y='252.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='24' font-weight='700' fill='#fff'>Aesthetics</text><text x='780.0' y='282.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='16' fill='#fff'>what the player feels</text><line x1='300' y1='260' x2='358' y2='260' stroke='#1F1B2E' stroke-width='3' marker-end='url(#a)'/><line x1='600' y1='260' x2='658' y2='260' stroke='#1F1B2E' stroke-width='3' marker-end='url(#a)'/><line x1='860' y1='380' x2='100' y2='380' stroke='#1F1B2E' stroke-width='3' marker-end='url(#a)'/><text x='480' y='412' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='18' fill='#1F1B2E'>The designer builds left → right. The player experiences right → left.</text><text x='480' y='470' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#6B6478'>Hunicke, LeBlanc &amp; Zubek (2004) — MDA: A Formal Approach to Game Design and Game Research</text></svg>