<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 540' role='img' aria-labelledby='t d'><title id='t'>The Flow Channel</title><desc id='d'>Challenge rises with skill; flow sits between anxiety and boredom (Csikszentmihalyi).</desc><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1F1B2E'/></marker></defs><rect width='960' height='540' fill='#FBF7F0'/><text x='48' y='64' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='30' font-weight='700' fill='#1F1B2E'>The Flow Channel</text><line x1='140' y1='470' x2='840' y2='470' stroke='#1F1B2E' stroke-width='3' marker-end='url(#a)'/><line x1='140' y1='470' x2='140' y2='110' stroke='#1F1B2E' stroke-width='3' marker-end='url(#a)'/><polygon points='140,430 840,110 840,230 180,470' fill='#2BA36B' opacity='0.25'/><text x='530.0' y='320.0' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='26' fill='#2BA36B'>FLOW</text><text x='290' y='180' text-anchor='start' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='20' fill='#E8553D'>Anxiety — too hard</text><text x='800' y='430' text-anchor='end' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='20' fill='#2E7DD7'>Boredom — too easy</text><path d='M170,410 C340,330 400,380 520,270 S700,240 800,150' fill='none' stroke='#F2A93B' stroke-width='5' stroke-dasharray='10 8'/><text x='740' y='220' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='16' fill='#1F1B2E'>good difficulty curve</text><text x='490.0' y='510' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='18' fill='#1F1B2E'>Player skill →</text><text x='110' y='290.0' transform='rotate(-90 110 290.0)' text-anchor='middle' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='18' fill='#1F1B2E'>Challenge →</text></svg>